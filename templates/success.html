<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent</title>

    <style>
        body{
            margin:0;
            padding:0;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            font-family:Arial, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            text-align:center;
            width:450px;
        }

        h1{
            color:#28a745;
            margin-bottom:15px;
        }

        p{
            font-size:18px;
            color:#555;
        }

        button{
            margin-top:25px;
            padding:12px 25px;
            border:none;
            border-radius:10px;
            background:#007BFF;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }
    </style>

</head>

<body>

<div class="card">

    <h1>✅ Email Sent Successfully</h1>

    <p>Your email has been sent successfully.</p>

    <button onclick="window.location.href='/'">
        Back to Home
    </button>

</div>

<script>

window.onload = function(){

    let speech = new SpeechSynthesisUtterance(
        "Email sent successfully"
    );

    speech.lang = "en-US";

    window.speechSynthesis.speak(speech);

};

</script>

</body>
</html>
